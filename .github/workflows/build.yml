name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create --platforms=android --project-name waha4k --org com.waha4k .

      - name: Patch manifest
        run: bash tool/patch_android.sh

      - name: Set Android compileSdk 36
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          echo "Checking compileSdk:"
          grep -n "compileSdk" android/app/build.gradle.kts

      - name: Remove generated sample test
        run: rm -rf test

      - name: Get dependencies
        run: flutter pub get

      - name: Patch file_picker compileSdk
        run: |
          python3 - <<'PY'
          import glob
          import re

          files = glob.glob(
              '/home/runner/.pub-cache/hosted/pub.dev/file_picker-*/android/build.gradle*'
          )

          print('file_picker Gradle files:', files)

          for path in files:
              text = open(path, encoding='utf-8').read()

              new = re.sub(
                  r'compileSdk(?:Version)?\s*(?:=\s*)?34\b',
                  'compileSdk = 36',
                  text
              )

              if new != text:
                  open(path, 'w', encoding='utf-8').write(new)
                  print('Patched:', path)
              else:
                  print('No compileSdk 34 found in:', path)

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: waha4k-apk
          path: build/app/outputs/flutter-apk/*.apk
