name: waha4k
description: Waha 4K - IPTV player (Xtream Codes & M3U)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.0
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  cached_network_image: ^3.3.1
  file_picker: ^8.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo.png
  adaptive_icon_background: "#120B24"
  adaptive_icon_foreground: assets/logo_fg.png

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
